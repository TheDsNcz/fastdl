<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Comunidade de Postagens</title>
  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-Gtv3r4kGN9cNETRyvQq+6oJle4kwCN6ZWxffOc6E7HXKamFOYGVSfasveRG/tKH0"
    crossorigin="anonymous"
  />
  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">Comunidade</a>
    </div>
  </nav>

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-lg-8">
        <h2 class="mb-3">Criar nova postagem</h2>
        <form id="post-form" class="card card-body mb-4 shadow-sm">
          <div class="mb-3">
            <label for="title" class="form-label">Título</label>
            <input type="text" class="form-control" id="title" required />
          </div>
          <div class="mb-3">
            <label for="content" class="form-label">Conteúdo</label>
            <textarea class="form-control" id="content" rows="4" required></textarea>
          </div>
          <button type="submit" class="btn btn-primary">Publicar</button>
        </form>

        <h2 class="mb-3">Postagens recentes</h2>
        <div id="posts-container"></div>
      </div>
    </div>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <!-- Bootstrap JS (optional for some components) -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-pp1fD+eQP1K3e0V3lpkyVqdx6Pl2I8OD6/ZVp7bkrzC30hz1qFQjZJ6G6a1MRU2o"
    crossorigin="anonymous"
  ></script>
  <!-- App JS -->
  <script src="script.js"></script>
</body>
</html>
